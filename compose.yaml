services:
  mc-panel:
    image: ${MCPANEL_IMAGE:-ghcr.io/calciumsilicate/mc-panel:latest}
    build: .
    init: true
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    stop_grace_period: 90s
    ports:
      # Keep first-account setup private; expose through your HTTPS reverse proxy.
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-16824}:16824"
      - "${MC_PORT_RANGE:-25565-25575}:${MC_PORT_RANGE:-25565-25575}/tcp"
      - "${MC_PORT_RANGE:-25565-25575}:${MC_PORT_RANGE:-25565-25575}/udp"
    volumes:
      - type: bind
        source: ${MCPANEL_DATA_PATH:-./docker-data}
        target: /data
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
